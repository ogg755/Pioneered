name: Build patched Mixxx .deb (arm64)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    container: debian:trixie
    steps:
      - uses: actions/checkout@v4

      - name: Enable source repos and install build tools
        run: |
          echo "deb-src http://deb.debian.org/debian trixie main" \
            > /etc/apt/sources.list.d/src.list
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential devscripts dpkg-dev quilt ca-certificates
          apt-get build-dep -y mixxx

      - name: Fetch and patch source
        run: |
          mkdir /build && cd /build
          apt-get source mixxx
          cd mixxx-*/
          patch -p1 < "$GITHUB_WORKSPACE/mixxx-patch/usb-browse.patch"
          patch -p1 < "$GITHUB_WORKSPACE/mixxx-patch/pdb-corruption-hardening.patch"
          patch -p1 < "$GITHUB_WORKSPACE/mixxx-patch/xdj-behavior.patch"
          patch -p1 < "$GITHUB_WORKSPACE/mixxx-patch/library-ui.patch"
          patch -p1 < "$GITHUB_WORKSPACE/mixxx-patch/xdj-hardware.patch"
          patch -p1 < "$GITHUB_WORKSPACE/mixxx-patch/search-osk.patch"
          patch -p1 < "$GITHUB_WORKSPACE/mixxx-patch/usb-force-eject.patch"
          patch -p1 < "$GITHUB_WORKSPACE/mixxx-patch/rekordbox-import-fixes.patch"
          patch -p1 < "$GITHUB_WORKSPACE/mixxx-patch/banner-overlay-transparency.patch"
          patch -p1 < "$GITHUB_WORKSPACE/mixxx-patch/headphone-gain-ceiling.patch"
          patch -p1 < "$GITHUB_WORKSPACE/mixxx-patch/hold-to-restart.patch"
          patch -p1 < "$GITHUB_WORKSPACE/mixxx-patch/system-menu.patch"
          DEBEMAIL=pioneered-build@localhost DEBFULLNAME="Pioneered CI" \
            dch --local "+usbbrowse.r${GITHUB_RUN_NUMBER}." "Pioneered USB browse/eject patch build ${GITHUB_RUN_NUMBER}"

      - name: Build package
        run: |
          cd /build/mixxx-*/
          dpkg-buildpackage -b -uc -us

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: mixxx-deb
          path: |
            /build/mixxx_*.deb
            /build/mixxx-data_*.deb
            /build/mixxx-dbgsym_*.deb
            /build/mixxx-dbgsym_*.ddeb
