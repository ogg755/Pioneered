name: Publish skin-only release

# Publishes a GitHub release for a pushed v* tag, re-attaching the .deb
# assets from the previous (latest) release. Use for skin-only changes
# where the Mixxx binaries are unchanged: the one-shot Pi updater
# (pi/update-pioneered.sh) requires every release to carry the three debs.
#
# Only runs when docs/release-notes/<tag>.md exists in the repo at the
# tagged commit; tags without a notes file are ignored, so releases with
# C++ changes can keep being assembled manually from build-mixxx-deb.yml
# artifacts without this workflow getting in the way.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check release notes exist
        id: notes
        run: |
          TAG="${GITHUB_REF_NAME}"
          NOTES="docs/release-notes/${TAG}.md"
          if [[ ! -f "$NOTES" ]]; then
            echo "No $NOTES in the repo — skipping release publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "notes=$NOTES" >> "$GITHUB_OUTPUT"

      - name: Download debs from previous release
        if: steps.notes.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PREV="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName)"
          echo "Reusing debs from $PREV"
          mkdir debs
          gh release download "$PREV" --repo "$GITHUB_REPOSITORY" --pattern '*.deb' --dir debs
          ls -l debs
          test "$(ls debs/*.deb | wc -l)" -ge 3

      - name: Create release
        if: steps.notes.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ steps.notes.outputs.notes }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          TITLE="$(head -1 "$NOTES" | sed 's/^# *//')"
          tail -n +2 "$NOTES" | sed '1{/^$/d}' > body.md
          gh release create "$TAG" debs/*.deb \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TITLE" \
            --notes-file body.md
